name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.
#
# "It does not gate" is about findings, not about delivery. A run that reviews
# and then cannot post what it found is indistinguishable from a clean diff,
# and the check is green either way. The last step here fails when that
# happens, for the same reason the token check fails rather than reviewing
# nothing quietly.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. Drafts are skipped until
    # they are marked ready, which is what the ready_for_review trigger is for.
    #
    # Dependabot is skipped for the same reason as a fork: a run it triggers
    # reads Dependabot secrets, not Actions secrets, so the token is empty no
    # matter what is configured here. A version bump is also the diff this
    # review has least to say about.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # The delivery check reads the pull request's conversation comments,
      # which GitHub serves from the issues endpoint.
      issues: read
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      # Anything the review posts has to be newer than this, or it is a
      # leftover from an earlier push and says nothing about this diff. Two
      # minutes of slack absorbs clock skew between the runner and the API.
      - name: Mark the start of this review
        id: started
        run: echo "at=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1
        id: claude
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Omega puts an authorization and audit layer on top of SPIFFE identity in one Go
            binary: X.509-SVID and JWT-SVID issuance, a Workload API socket, an OpenID
            AuthZEN 1.0 PDP backed by Cedar, trust-bundle federation, and a hash-chained
            audit log. It also ships a Kubernetes operator with an OmegaDomain CRD and a
            cert-manager Issuer, a Helm chart under charts/, and a dashboard under ui/.

            Do not repeat what CI already does. golangci-lint, go vet, the tests, CodeQL and
            the scorecard run on this PR already.

            Look for what only a reader can catch:

            1. Audit chain integrity. Each entry chains to the hash of the previous one.
               Anything that writes, reorders, backfills or prunes entries has to leave the
               chain verifiable. A break makes the whole log worthless, not one entry.

            2. Trust boundaries. A signature, expiry, trust domain or audience check that is
               skipped, that passes on empty input, or whose error is swallowed. Federation
               is the sharp case: accepting a bundle from the wrong trust domain hands an
               attacker an identity.

            3. Fail-open. A Cedar policy that fails to compile or evaluate, a PDP that is
               unreachable, a malformed request: each must deny rather than fall through.

            4. Spec fidelity. AuthZEN 1.0 is a Final Specification, so request and response
               shapes come from the spec text rather than from what reads nicely here.

            5. Artifacts that must move together. The CRD, its generated deepcopy, the Helm
               chart and the docs. A field added in one and missing in another is silent
               until install time.

            6. Licensing. Apache-2.0 with no CLA is a deliberate position, so a new copyleft
               or source-available dependency is worth naming.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

            Write the summary to a file and post it with
            `gh pr comment --body-file <path>`. A body built inline from a
            heredoc or a command substitution does not match the allowlist and
            is refused, which loses the whole review.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Write,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The gate below keys off the action's conclusion output. Print what it
      # was, so a run that gates when it should not - or does not when it
      # should - can be diagnosed from the log rather than by guessing.
      - name: Report the review outcome
        if: always()
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          echo "action conclusion: '${CONCLUSION}'"
          echo "execution file:    '${EXECUTION_FILE}'"

      # Two of the three runs on #136 reviewed for two minutes, hit a denied
      # tool call on the way to posting, and went green with the pull request
      # unreviewed. Write is allowed above so a long summary can go to a file
      # and out through `gh pr comment --body-file`, which is the shape the
      # allowlist matches; this catches it when something is refused anyway.
      #
      # Silence on its own is not the signal. A follow-up push whose review had
      # nothing to add to what is already on the pull request posts nothing and
      # denies nothing, and that is fine. The failure is silence *with* a
      # refusal behind it. An unreadable denial count is treated as a refusal,
      # because the whole point is not to call a pull request reviewed on the
      # strength of a green check.
      - name: Fail on a review that was not delivered
        if: always() && steps.claude.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          # The action's default bot_name, which this workflow does not override.
          BOT: claude[bot]
        run: |
          set -euo pipefail
          fresh() {
            gh api --paginate "$1" --jq \
              "[.[] | select(.user.login == \"$BOT\") | select((.$2 // \"\") >= \"$SINCE\")] | length" |
              awk '{ n += $1 } END { print n + 0 }'
          }
          summary=$(fresh "repos/$REPO/issues/$PR/comments" updated_at)
          inline=$(fresh "repos/$REPO/pulls/$PR/comments" updated_at)
          reviews=$(fresh "repos/$REPO/pulls/$PR/reviews" submitted_at)
          total=$((summary + inline + reviews))
          echo "posted since $SINCE: $summary summary, $inline inline, $reviews review(s)"
          if [ "$total" -gt 0 ]; then
            exit 0
          fi

          denials=unknown
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            denials=$(jq -r '[.. | objects | select(.type? == "result") | .permission_denials_count?]
              | map(select(. != null)) | last // 0' "$EXECUTION_FILE" 2>/dev/null || echo unknown)
          fi
          echo "denied tool calls: $denials"
          if [ "$denials" = "0" ]; then
            echo "::notice::The review posted nothing and nothing was refused, so it had nothing to add to what is already on this pull request."
            exit 0
          fi
          echo "::error::The review ran, was refused a tool call ($denials), and posted nothing, so this pull request is unreviewed despite a green check. Widen --allowedTools above."
          exit 1
