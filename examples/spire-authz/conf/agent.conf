agent {
  data_dir          = "/opt/spire/data/agent"
  log_level         = "INFO"
  server_address    = "spire-server"
  server_port       = "8081"
  socket_path       = "/run/spire/sockets/agent.sock"
  trust_domain      = "upstream.demo"
  trust_bundle_path = "/opt/spire/conf/agent/bootstrap.crt"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "memory" {
    plugin_data {}
  }

  # unix rather than docker. The docker attestor would identify omega's
  # container by label, but it needs the host Docker daemon socket inside the
  # agent - a handle on the host that a demo has no business holding. The unix
  # attestor reads the caller's credentials off the socket instead.
  #
  # discover_workload_path adds the path and sha256 selectors. Without it the
  # only usable selector here is unix:uid:0, which every root process on the
  # node satisfies; with it the entry names the binary.
  WorkloadAttestor "unix" {
    plugin_data {
      discover_workload_path = true
    }
  }
}
