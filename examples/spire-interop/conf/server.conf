server {
  bind_address  = "0.0.0.0"
  bind_port     = "8081"
  trust_domain  = "upstream.demo"
  data_dir      = "/opt/spire/data/server"
  log_level     = "INFO"

  # Short so a rotation is a demo step rather than a wait. A real deployment
  # leaves these at the defaults.
  ca_ttl                = "1h"
  default_x509_svid_ttl = "10m"

  # ec-p256 for both. Omega consumes only EC P-256 (ES256) JWT signing keys,
  # so an upstream on the rsa-2048 default has no key it can use and
  # --identity-source-workload-api-jwt fails closed at startup. That is the
  # interop constraint this example exists to make concrete.
  ca_key_type  = "ec-p256"
  jwt_key_type = "ec-p256"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type     = "sqlite3"
      connection_string = "/opt/spire/data/server/datastore.sqlite3"
    }
  }

  # join_token keeps node attestation to one shell command. A real deployment
  # uses a platform attestor (k8s_psat, aws_iid, x509pop).
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "disk" {
    plugin_data {
      keys_path = "/opt/spire/data/server/keys.json"
    }
  }
}
