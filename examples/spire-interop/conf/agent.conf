agent {
  data_dir          = "/opt/spire/data/agent"
  log_level         = "INFO"
  server_address    = "spire-server"
  server_port       = "8081"
  socket_path       = "/run/spire/sockets/agent.sock"
  trust_domain      = "upstream.demo"
  trust_bundle_path = "/opt/spire/conf/agent/bootstrap.crt"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "memory" {
    plugin_data {}
  }

  # The docker attestor is what lets the agent recognise omega's container by
  # label. The unix attestor is here so the uid/gid selectors are available
  # too, which is what a non-containerised control plane would be matched on.
  WorkloadAttestor "docker" {
    plugin_data {}
  }

  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
