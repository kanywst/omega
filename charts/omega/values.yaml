# Default values for the Omega chart.
# This is a YAML-formatted file.

image:
  repository: ghcr.io/kanywst/omega
  tag: ""            # defaults to .Chart.AppVersion if empty
  pullPolicy: IfNotPresent

imagePullSecrets: []

server:
  enabled: true
  replicas: 1
  httpAddr: "0.0.0.0:8080"
  trustDomain: omega.local
  dataDir: /var/lib/omega
  policyDir: ""      # set to a path inside the container to load *.cedar at boot
  # SPIFFE IDs that may create top-level domains and administer every
  # domain (--domain-root-admin). Enforced only with --require-auth.
  # Prefer making the operator an admin of one parent domain over listing
  # it here: whoever may create OmegaDomain objects acts with the
  # operator's domain authority, and spec.admins can name anyone.
  domainRootAdmins: []
  # SPIFFE IDs, or prefixes ending in "/", of the node agents running a
  # local PDP (--decision-recorder): only they may read the policy bundle
  # and record local decisions. Needs --require-auth.
  decisionRecorders: []
  # Secret whose "bundle.key" holds an ECDSA P-256 private key; when set,
  # every policy bundle served to node agents is signed with it
  # (--policy-bundle-signing-key). Agents verify with the public half.
  policyBundleSigningKeySecret: ""
  # Identity providers that provision users and groups over SCIM 2.0
  # (--scim-idp). Each entry: name, domain (must exist), tokenSecret (a
  # Secret in this namespace whose "token" key holds the bearer token)
  # and an optional template. The token is mounted read-only.
  #   scimProviders:
  #     - name: corp
  #       domain: people
  #       tokenSecret: omega-scim-corp
  scimProviders: []
  extraArgs: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 8080
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

agent:
  enabled: true
  socketPath: /run/omega/agent.sock
  serverURL: "http://omega-server:8080"
  uidMap: []         # list of "uid=N,id=spiffe://..."
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi
  hostSocketPath: /run/omega
  hostNetwork: false
  # The agent creates its socket in hostSocketPath, which kubelet creates
  # root-owned on a fresh node, so it runs as root. Every capability is
  # still dropped and the root filesystem is read-only (securityContext).
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  # Local policy decisions on the node (--local-pdp-addr). Needs an
  # https serverURL and a Secret holding the agent's SVID: ca.crt (the
  # control plane's CA), tls.crt and tls.key. List the agents' SPIFFE IDs
  # in server.decisionRecorders.
  localPDP:
    enabled: false
    addr: "127.0.0.1:8181"
    tlsSecret: ""
    # Verify bundle signatures with "bundle.pub", the public half of
    # server.policyBundleSigningKeySecret, which tlsSecret must then hold.
    # Needs server.policyBundleSigningKeySecret.
    verifyBundle: false
    # Spool decisions to an emptyDir so they survive an agent container
    # crash and restart (not the pod's deletion); one fsync per decision.
    spool: false
  extraArgs: []

# The upstream SPIFFE CSI driver, so pods mount the agent's Workload API
# socket with a `csi.spiffe.io` ephemeral volume instead of a hostPath.
# It runs privileged (for mount propagation) and installs the
# cluster-wide CSIDriver `csi.spiffe.io`; do not enable it next to
# another SPIFFE CSI driver.
csi:
  enabled: false
  image: ghcr.io/spiffe/spiffe-csi-driver:0.2.13
  registrarImage: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.6.0

policy:
  # Inline Cedar policies rendered into a ConfigMap and mounted at server.policyDir.
  # Each key becomes a file. Set server.policyDir to /etc/omega/policy to use.
  inline: {}
  # Example:
  # inline:
  #   web.cedar: |
  #     permit(
  #       principal == Spiffe::"spiffe://omega.local/example/web",
  #       action    == Action::"GET",
  #       resource  == HttpPath::"/api/foo"
  #     );

serviceAccount:
  create: true
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
