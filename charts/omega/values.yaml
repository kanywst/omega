# Default values for the Omega chart.
# This is a YAML-formatted file.

image:
  repository: ghcr.io/kanywst/omega
  tag: ""            # defaults to .Chart.AppVersion if empty
  pullPolicy: IfNotPresent

imagePullSecrets: []

server:
  enabled: true
  replicas: 1
  httpAddr: "0.0.0.0:8080"
  trustDomain: omega.local
  dataDir: /var/lib/omega
  policyDir: ""      # set to a path inside the container to load *.cedar at boot
  # SPIFFE IDs that may create top-level domains and administer every
  # domain (--domain-root-admin). Enforced only with --require-auth.
  # Prefer making the operator an admin of one parent domain over listing
  # it here: whoever may create OmegaDomain objects acts with the
  # operator's domain authority, and spec.admins can name anyone.
  domainRootAdmins: []
  # SPIFFE IDs, or prefixes ending in "/", of the node agents running a
  # local PDP (--decision-recorder): only they may read the policy bundle
  # and record local decisions. Needs --require-auth.
  decisionRecorders: []
  # Secret whose "bundle.key" holds an ECDSA P-256 private key; when set,
  # every policy bundle served to node agents is signed with it
  # (--policy-bundle-signing-key). Agents verify with the public half.
  policyBundleSigningKeySecret: ""
  # Identity providers that provision users and groups over SCIM 2.0
  # (--scim-idp). Each entry: name, domain (must exist), tokenSecret (a
  # Secret in this namespace whose "token" key holds the bearer token)
  # and an optional template. The token is mounted read-only.
  #   scimProviders:
  #     - name: corp
  #       domain: people
  #       tokenSecret: omega-scim-corp
  scimProviders: []
  extraArgs: []
  # Extra labels on the server pods, e.g. azure.workload.identity/use:
  # "true" for Azure workload identity.
  podLabels: {}
  # The CA that signs X.509-SVIDs and JWT-SVIDs (--ca-backend). "disk"
  # keeps a self-signed CA under dataDir, for evaluation. The chart
  # configures disk, aws-pca, gcp-cas and azure-keyvault; pass other
  # backends' flags (vault-pki, step-ca) through extraArgs and leave this
  # at disk.
  ca:
    backend: disk
    # backend: aws-pca signs with AWS Private CA. Credentials come from the
    # pod's AWS identity (IRSA via serviceAccount.annotations, or EKS Pod
    # Identity), never from values.
    awsPCA:
      arn: ""              # required for aws-pca: certificate-authority ARN
      region: ""           # empty takes the region from arn
      endpoint: ""         # e.g. a VPC interface endpoint URL
      templateArn: ""      # empty uses EndEntityCertificate_APIPassthrough/V1
      signingAlgorithm: "" # empty infers it from the CA key
    # backend: gcp-cas signs through a Google Cloud Certificate Authority
    # Service CA pool. Credentials come from Application Default
    # Credentials: on GKE, bind the chart's ServiceAccount to a Google
    # service account with Workload Identity (serviceAccount.annotations,
    # iam.gke.io/gcp-service-account); elsewhere, set credentialsSecret to
    # a Secret whose "credentials.json" key holds a credentials file. The
    # pool's issuance policy must allow SAN passthrough.
    gcpCas:
      pool: ""                 # projects/<project>/locations/<location>/caPools/<pool>
      endpoint: ""             # empty: https://privateca.googleapis.com
      issuingCA: ""            # optional CA id inside the pool
      certificateTemplate: ""  # optional projects/<p>/locations/<l>/certificateTemplates/<t>
      credentialsSecret: ""
    # backend: azure-keyvault keeps the CA private key in Azure Key Vault
    # or Managed HSM; Omega signs through it. Credentials: Azure workload
    # identity (annotate the service account with
    # azure.workload.identity/client-id and set the podLabels above), a
    # managed identity, or credentialsSecret.
    azureKeyVault:
      url: ""            # https://<vault>.vault.azure.net
      key: ""            # an EC P-256 key
      keyVersion: ""     # empty: the current version at startup; required when replicas > 1
      # Secret whose "ca.crt" holds the CA certificate for the key, plus
      # any CA certificate to trust beside it. Empty: each replica
      # self-signs one into its data volume, so set it when replicas > 1.
      caCertSecret: ""
      # Secret loaded as environment variables (AZURE_TENANT_ID,
      # AZURE_CLIENT_ID, AZURE_CLIENT_SECRET) for a service principal.
      # A client secret takes precedence over workload identity.
      credentialsSecret: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 8080
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

agent:
  enabled: true
  socketPath: /run/omega/agent.sock
  serverURL: "http://omega-server:8080"
  uidMap: []         # list of "uid=N,id=spiffe://..."
  # Identify workloads in pods on the node by their pod (namespace,
  # service account, pod name) instead of their UID, for development
  # and evaluation. Turns on hostPID, which the attestor needs to read a
  # peer's cgroup, and runs the agent under its own ServiceAccount that
  # may list pods.
  # Needs a server without --require-auth (see ADR 0020).
  k8sWorkloadAttestor:
    enabled: false
    # Empty renders spiffe://<server.trustDomain>/k8s/{namespace}/{serviceaccount}.
    # Placeholders: {namespace}, {serviceaccount}, {podname}.
    svidTemplate: ""
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi
  # Kubelet creates hostSocketPath root-owned on a fresh node; an init
  # container with only CAP_CHOWN hands it to the agent's user, so the
  # agent itself stays non-root. It must be a directory used only by the
  # agent, under /run/omega* or /var/run/omega*: its owner and mode are
  # changed on every node.
  hostSocketPath: /run/omega
  hostNetwork: false
  # Where the agent runs. The CSI driver (csi.enabled) uses the same, so
  # it is on every node that serves the Workload API.
  nodeSelector: {}
  tolerations: []

  # Local policy decisions on the node (--local-pdp-addr). Needs an
  # https serverURL and a Secret holding the agent's SVID: ca.crt (the
  # control plane's CA), tls.crt and tls.key. List the agents' SPIFFE IDs
  # in server.decisionRecorders.
  localPDP:
    enabled: false
    addr: "127.0.0.1:8181"
    tlsSecret: ""
    # Verify bundle signatures with "bundle.pub", the public half of
    # server.policyBundleSigningKeySecret, which tlsSecret must then hold.
    # Needs server.policyBundleSigningKeySecret. false trusts bundles on
    # TLS alone (--insecure-unsigned-policy-bundles).
    verifyBundle: true
    # Spool decisions to an emptyDir so they survive an agent container
    # crash and restart (not the pod's deletion); one fsync per decision.
    spool: false
  extraArgs: []

# The upstream SPIFFE CSI driver, so pods mount the agent's Workload API
# socket with a `csi.spiffe.io` ephemeral volume instead of a hostPath.
# It runs privileged (for mount propagation) and installs the
# cluster-wide CSIDriver `csi.spiffe.io`; do not enable it next to
# another SPIFFE CSI driver.
# Trust boundary: any pod in any namespace that mounts a csi.spiffe.io
# volume reaches the agent, and the agent attests by UID only, so a pod
# running as a UID in agent.uidMap gets that identity. Keep mapped UIDs
# unique per workload and restrict csi.spiffe.io volumes with admission
# policy (docs/threat-model.md, S4).
csi:
  enabled: false
  # Pinned by digest: the driver runs privileged with bidirectional mounts.
  image: ghcr.io/spiffe/spiffe-csi-driver:0.2.13@sha256:6f1ba5d635ba9bf55ae69ba11d71bf169c8fa3e0139a5063738cbc227c8b5546
  registrarImage: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 16Mi

policy:
  # Inline Cedar policies rendered into a ConfigMap and mounted at server.policyDir.
  # Each key becomes a file. Set server.policyDir to /etc/omega/policy to use.
  inline: {}
  # Example:
  # inline:
  #   web.cedar: |
  #     permit(
  #       principal == Spiffe::"spiffe://omega.local/example/web",
  #       action    == Action::"GET",
  #       resource  == HttpPath::"/api/foo"
  #     );

serviceAccount:
  create: true
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
