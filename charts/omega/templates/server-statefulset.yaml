{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "omega.serverName" . }}
  labels:
{{ include "omega.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  serviceName: {{ include "omega.serverName" . }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omega.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
{{ include "omega.commonLabels" . | indent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "omega.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "omega.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - server
            - --http-addr={{ .Values.server.httpAddr }}
            - --trust-domain={{ .Values.server.trustDomain }}
            - --data-dir={{ .Values.server.dataDir }}
            {{- if .Values.server.policyDir }}
            - --policy-dir={{ .Values.server.policyDir }}
            {{- end }}
            {{- range .Values.server.domainRootAdmins }}
            - --domain-root-admin={{ . }}
            {{- end }}
            {{- range .Values.server.decisionRecorders }}
            - --decision-recorder={{ . }}
            {{- end }}
            {{- if .Values.server.policyBundleSigningKeySecret }}
            - --policy-bundle-signing-key=/etc/omega/bundle-signing/bundle.key
            {{- end }}
            {{- range .Values.server.scimProviders }}
            - --scim-idp=name={{ .name }},domain={{ .domain }},token-file=/etc/omega/scim/{{ .name }}/token{{ if .template }},template={{ .template }}{{ end }}
            {{- end }}
            {{- $ca := .Values.server.ca }}
            {{- if not (has $ca.backend (list "disk" "azure-keyvault")) }}
            {{- fail (printf "server.ca.backend %q is not configurable through the chart (supported: disk, azure-keyvault); use server.extraArgs for other backends" $ca.backend) }}
            {{- end }}
            {{- if ne $ca.backend "disk" }}
            - --ca-backend={{ $ca.backend }}
            {{- end }}
            {{- if eq $ca.backend "azure-keyvault" }}
            {{- if and (gt (int .Values.server.replicas) 1) (not $ca.azureKeyVault.caCertSecret) }}
            {{- fail "server.ca.azureKeyVault.caCertSecret is required when server.replicas > 1, so every replica serves the same CA" }}
            {{- end }}
            - --ca-azure-keyvault-url={{ required "server.ca.azureKeyVault.url is required with server.ca.backend=azure-keyvault" $ca.azureKeyVault.url }}
            - --ca-azure-keyvault-key={{ required "server.ca.azureKeyVault.key is required with server.ca.backend=azure-keyvault" $ca.azureKeyVault.key }}
            {{- with $ca.azureKeyVault.keyVersion }}
            - --ca-azure-keyvault-key-version={{ . }}
            {{- end }}
            {{- if $ca.azureKeyVault.caCertSecret }}
            - --ca-azure-keyvault-ca-cert=/etc/omega/azure-keyvault/ca.crt
            {{- end }}
            {{- end }}
            {{- range .Values.server.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if and (eq .Values.server.ca.backend "azure-keyvault") .Values.server.ca.azureKeyVault.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.server.ca.azureKeyVault.credentialsSecret }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.server.dataDir }}
            {{- if and .Values.policy.inline (gt (len .Values.policy.inline) 0) .Values.server.policyDir }}
            - name: policy
              mountPath: {{ .Values.server.policyDir }}
              readOnly: true
            {{- end }}
            {{- if .Values.server.policyBundleSigningKeySecret }}
            - name: bundle-signing
              mountPath: /etc/omega/bundle-signing
              readOnly: true
            {{- end }}
            {{- range $i, $p := .Values.server.scimProviders }}
            - name: scim-{{ $i }}
              mountPath: /etc/omega/scim/{{ $p.name }}
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.server.ca.backend "azure-keyvault") .Values.server.ca.azureKeyVault.caCertSecret }}
            - name: azure-keyvault-ca
              mountPath: /etc/omega/azure-keyvault
              readOnly: true
            {{- end }}
      {{- $hasPolicy := and .Values.policy.inline (gt (len .Values.policy.inline) 0) .Values.server.policyDir -}}
      {{- $hasEmpty := not .Values.server.persistence.enabled -}}
      {{- $hasSCIM := gt (len .Values.server.scimProviders) 0 -}}
      {{- $hasSigning := .Values.server.policyBundleSigningKeySecret -}}
      {{- $hasAzureCA := and (eq .Values.server.ca.backend "azure-keyvault") .Values.server.ca.azureKeyVault.caCertSecret -}}
      {{- if or $hasPolicy $hasEmpty $hasSCIM $hasSigning $hasAzureCA }}
      volumes:
        {{- if $hasPolicy }}
        - name: policy
          configMap:
            name: {{ include "omega.serverName" . }}-policy
        {{- end }}
        {{- if $hasEmpty }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if $hasSigning }}
        - name: bundle-signing
          secret:
            secretName: {{ .Values.server.policyBundleSigningKeySecret }}
            items:
              - key: bundle.key
                path: bundle.key
        {{- end }}
        {{- range $i, $p := .Values.server.scimProviders }}
        - name: scim-{{ $i }}
          secret:
            secretName: {{ $p.tokenSecret }}
            items:
              - key: token
                path: token
        {{- end }}
        {{- if $hasAzureCA }}
        - name: azure-keyvault-ca
          secret:
            secretName: {{ .Values.server.ca.azureKeyVault.caCertSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- end }}
  {{- if .Values.server.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.server.persistence.size }}
        {{- with .Values.server.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
  {{- end }}
{{- end }}
