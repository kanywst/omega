{{- if and .Values.agent.enabled .Values.agent.k8sWorkloadAttestor.enabled }}
# The agent's Kubernetes workload attestor lists the pods on its node
# (field selector spec.nodeName). RBAC cannot scope list to one node,
# so this is cluster-wide read of pod specs; it grants no secrets and
# no kubelet access, and goes to the agent's own ServiceAccount only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "omega.agentServiceAccountName" . }}
  labels:
{{ include "omega.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "omega.agentName" . }}-pod-reader
  labels:
{{ include "omega.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "omega.agentName" . }}-pod-reader
  labels:
{{ include "omega.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "omega.agentName" . }}-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "omega.agentServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
