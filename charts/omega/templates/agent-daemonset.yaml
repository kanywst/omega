{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "omega.agentName" . }}
  labels:
{{ include "omega.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omega.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
{{ include "omega.commonLabels" . | indent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "omega.serviceAccountName" . }}
      hostNetwork: {{ .Values.agent.hostNetwork }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Hand the root-owned hostPath directory to the agent's user.
        {{- $hostDir := clean .Values.agent.hostSocketPath }}
        {{- if has $hostDir (list "/" "/run" "/var/run" "/tmp" "/var" "/var/lib" "/var/lib/kubelet" "/etc" "/home" "/root" "/opt" "/usr") }}
        {{- fail (printf "agent.hostSocketPath %q is a shared host directory; its owner and mode would be changed on every node. Use a dedicated directory such as /run/omega." $hostDir) }}
        {{- end }}
        - name: prepare-socket-dir
          image: {{ include "omega.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - agent
            - prepare-socket-dir
            - --dir={{ dir .Values.agent.socketPath }}
            - --uid={{ required "podSecurityContext.runAsUser is required: the agent's socket directory is handed to that user" .Values.podSecurityContext.runAsUser }}
            - --gid={{ required "podSecurityContext.runAsGroup is required: the agent's socket directory is handed to that group" .Values.podSecurityContext.runAsGroup }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: agent-sock
              mountPath: {{ dir .Values.agent.socketPath }}
      containers:
        - name: agent
          image: {{ include "omega.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - agent
            - --socket={{ .Values.agent.socketPath }}
            - --server={{ .Values.agent.serverURL }}
            {{- range .Values.agent.uidMap }}
            - {{ printf "--map=%s" . | quote }}
            {{- end }}
            {{- if .Values.agent.localPDP.enabled }}
            - --local-pdp-addr={{ .Values.agent.localPDP.addr }}
            - --server-ca=/etc/omega/agent-tls/ca.crt
            - --client-cert=/etc/omega/agent-tls/tls.crt
            - --client-key=/etc/omega/agent-tls/tls.key
            {{- if and .Values.server.policyBundleSigningKeySecret (not .Values.agent.localPDP.verifyBundle) }}
            {{- fail "server.policyBundleSigningKeySecret is set but agent.localPDP.verifyBundle is false: the agents would ignore the signatures" }}
            {{- end }}
            {{- if .Values.agent.localPDP.verifyBundle }}
            {{- if not .Values.server.policyBundleSigningKeySecret }}
            {{- fail "agent.localPDP.verifyBundle needs server.policyBundleSigningKeySecret: an agent that verifies signatures refuses every unsigned bundle" }}
            {{- end }}
            - --policy-bundle-key=/etc/omega/agent-tls/bundle.pub
            {{- end }}
            {{- if .Values.agent.localPDP.spool }}
            - --decision-spool=/var/lib/omega-agent/decisions.spool
            {{- end }}
            {{- end }}
            {{- range .Values.agent.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: agent-sock
              mountPath: {{ dir .Values.agent.socketPath }}
            {{- if .Values.agent.localPDP.enabled }}
            - name: agent-tls
              mountPath: /etc/omega/agent-tls
              readOnly: true
            {{- if .Values.agent.localPDP.spool }}
            - name: decision-spool
              mountPath: /var/lib/omega-agent
            {{- end }}
            {{- end }}
      volumes:
        - name: agent-sock
          hostPath:
            path: {{ .Values.agent.hostSocketPath }}
            type: DirectoryOrCreate
        {{- if .Values.agent.localPDP.enabled }}
        - name: agent-tls
          secret:
            secretName: {{ required "agent.localPDP.tlsSecret is required when agent.localPDP.enabled" .Values.agent.localPDP.tlsSecret }}
        {{- if .Values.agent.localPDP.spool }}
        - name: decision-spool
          emptyDir: {}
        {{- end }}
        {{- end }}
{{- end }}
