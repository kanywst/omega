{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "omega.agentName" . }}
  labels:
{{ include "omega.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omega.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
{{ include "omega.commonLabels" . | indent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "omega.serviceAccountName" . }}
      hostNetwork: {{ .Values.agent.hostNetwork }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "omega.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - agent
            - --socket={{ .Values.agent.socketPath }}
            - --server={{ .Values.agent.serverURL }}
            {{- range .Values.agent.uidMap }}
            - {{ printf "--map=%s" . | quote }}
            {{- end }}
            {{- if .Values.agent.localPDP.enabled }}
            - --local-pdp-addr={{ .Values.agent.localPDP.addr }}
            - --server-ca=/etc/omega/agent-tls/ca.crt
            - --client-cert=/etc/omega/agent-tls/tls.crt
            - --client-key=/etc/omega/agent-tls/tls.key
            {{- if and .Values.server.policyBundleSigningKeySecret (not .Values.agent.localPDP.verifyBundle) }}
            {{- fail "server.policyBundleSigningKeySecret is set but agent.localPDP.verifyBundle is false: the agents would ignore the signatures" }}
            {{- end }}
            {{- if .Values.agent.localPDP.verifyBundle }}
            {{- if not .Values.server.policyBundleSigningKeySecret }}
            {{- fail "agent.localPDP.verifyBundle (the default) needs server.policyBundleSigningKeySecret: an agent that verifies signatures refuses every unsigned bundle. Set the secret, or agent.localPDP.verifyBundle=false to trust bundles on TLS alone" }}
            {{- end }}
            - --policy-bundle-key=/etc/omega/agent-tls/bundle.pub
            {{- else }}
            - --insecure-unsigned-policy-bundles
            {{- end }}
            {{- if .Values.agent.localPDP.spool }}
            - --decision-spool=/var/lib/omega-agent/decisions.spool
            {{- end }}
            {{- end }}
            {{- range .Values.agent.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: agent-sock
              mountPath: {{ dir .Values.agent.socketPath }}
            {{- if .Values.agent.localPDP.enabled }}
            - name: agent-tls
              mountPath: /etc/omega/agent-tls
              readOnly: true
            {{- if .Values.agent.localPDP.spool }}
            - name: decision-spool
              mountPath: /var/lib/omega-agent
            {{- end }}
            {{- end }}
      volumes:
        - name: agent-sock
          hostPath:
            path: {{ .Values.agent.hostSocketPath }}
            type: DirectoryOrCreate
        {{- if .Values.agent.localPDP.enabled }}
        - name: agent-tls
          secret:
            secretName: {{ required "agent.localPDP.tlsSecret is required when agent.localPDP.enabled" .Values.agent.localPDP.tlsSecret }}
        {{- if .Values.agent.localPDP.spool }}
        - name: decision-spool
          emptyDir: {}
        {{- end }}
        {{- end }}
{{- end }}
