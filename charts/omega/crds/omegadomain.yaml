apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: omegadomains.omega.kanywst.github.io
spec:
  group: omega.kanywst.github.io
  scope: Cluster
  names:
    kind: OmegaDomain
    listKind: OmegaDomainList
    plural: omegadomains
    singular: omegadomain
    shortNames:
      - odom
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.domainName
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                domainName:
                  type: string
                  maxLength: 253
                  pattern: '^[a-z0-9]([a-z0-9_-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9_-]*[a-z0-9])?)*$'
                  description: |
                    SPIFFE-style namespace identifier (e.g. "media.news").
                    Defaults to metadata.name when empty.
                description:
                  type: string
                  description: Free-form operator-facing label.
                admins:
                  type: array
                  description: |
                    SPIFFE IDs that administer this domain and every domain
                    below it. Applied only when the domain is created; later
                    edits, including removals, are not reconciled. The
                    parent domain must already exist. The operator creates
                    the domain with its own identity, so permission to
                    create OmegaDomain objects carries the operator's
                    domain authority.
                  items:
                    type: string
                    pattern: '^spiffe://[^/]+(/.*)?$'
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
